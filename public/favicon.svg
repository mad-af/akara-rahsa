<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Akara Rahsa">
  <!-- Akara Rahsa mark: the wordmark's "A" knocked out of a solid gold tile.
       The letter is Playfair Display at weight 900, converted to outlines. It is
       NOT a <text> element on purpose: favicons render isolated from the page, so
       the webfont is unavailable there and a text element silently falls back to
       whatever serif the system has.
       The dark plate underneath keeps the counter opaque; left transparent it
       would show the browser's tab colour, which differs between light and dark
       themes. Single path plus fill-rule="evenodd" cuts the hole, which survives
       rasterisation more reliably than a mask. -->
