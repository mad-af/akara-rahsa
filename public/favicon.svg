<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Akara Rahsa">
  <!-- Akara Rahsa mark: "A" knocked out of a solid gold tile.

       The letter is Noto Sans at weight 800, converted to outlines.

       Two things here were learned the hard way and should not be undone:

       1. It is NOT a <text> element. A favicon renders isolated from the
          document, so the page's webfont never reaches it and a text element
          silently falls back to whatever the system has.
       2. It is NOT set in Playfair, even though Playfair is the display face
          everywhere else on the site. Playfair is a didone: at 16px its thin
          left stroke and hairline crossbar dissolve completely and the letter
          reads as a lopsided blob. Noto Sans has even stroke weight, so the
          crossbar and counter survive. Weight and optical size were chosen by
          rendering candidates at true 16px, not judged at display size.

       The dark plate sits underneath so the counter is opaque brand black; left
       transparent it would show the browser's tab colour, which differs between
       light and dark themes. -->
  <rect width="64" height="64" fill="#0B0B0C"/>
  <path fill="#E8B93C" fill-rule="evenodd" d="M0 0H64V64H0Z M43.365724808228734 56.31999999999999 40.26476399058578 45.990145353905156H23.79967486052999L20.659370859483964 56.31999999999999H8.001618723849376L24.4633084902371 7.68H39.390166928172945L55.998381276150624 56.31999999999999ZM34.9353401760809 27.03543845885634Q34.62464413354254 25.903235050557875 34.0425952318689 23.701567403242674Q33.46054633019526 21.499899755927473 32.885621186366805 19.14288408734309Q32.31069604253835 16.78586841875871 31.985752484309625 15.32872145223152Q31.700152109483962 16.899848544281724 31.16626983089261 19.12118778329846Q30.632387552301257 21.342527022315195 30.098505273709904 23.46040925732217Q29.56462299511855 25.578291492329143 29.186088737796375 27.03543845885634L26.37072829497908 36.383013641910736H37.73645310320781Z"/>
</svg>
