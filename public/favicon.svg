<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Akara Rahsa">
  <!-- Akara Rahsa mark: Playfair Display "A" (weight 900) knocked out of a gold
       tile, converted to outlines.

       Not a <text> element on purpose: a favicon renders isolated from the page,
       so it can never reach the webfont and would fall back to a system serif.

       The stroke is doing real work, not decoration. Playfair is a didone, so its
       left diagonal and crossbar are hairlines. Rendered flat they fall below one
       device pixel at small sizes and vanish, leaving a lopsided blob. Stroking
       the path in the same colour thickens every contour uniformly, which lifts
       those hairlines back over a pixel while leaving the letterform itself
       untouched. It is the same correction a type designer makes when cutting an
       optical size for small text.

       The value here is tuned for the sizes browsers actually request the SVG at.
       The raster sizes carry their own values, strongest at 16px and almost none
       at 512px, which is why they are generated rather than scaled from one file.

       The dark plate underneath keeps the counter opaque; left transparent it
       would show the browser's tab colour, which differs between themes. -->
